    # --- Caching (keep in sync with gcp/nginx-cache.conf; update-vm.sh inserts this
    # block into existing sites). The page shell and the service worker must never be
    # cached, or a new deploy (e.g. a rename) stays invisible for hours behind
    # Cloudflare and the browser. Fingerprinted build files never change, so cache
    # them for a year.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # --- end caching
