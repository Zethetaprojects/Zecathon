# ZECKATHON nginx site configuration
# Place this file at /etc/nginx/sites-available/zecathon and symlink to
# sites-enabled, then reload nginx.

server {
    listen 80;
    server_name {{DOMAIN}};

    client_max_body_size 25M;

    # Frontend static SPA
    root /opt/zecathon/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Caching (keep in sync with gcp/nginx-cache.conf; update-vm.sh inserts this
    # block into existing sites). The page shell and the service worker must never be
    # cached, or a new deploy (e.g. a rename) stays invisible for hours behind
    # Cloudflare and the browser. Fingerprinted build files never change, so cache
    # them for a year.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # --- end caching

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Uploaded files served by backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Basic hardening for the SPA and API responses.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
