# Docker Compose for local ZECATHON development with PostgreSQL.
# The `version` attribute is intentionally omitted; modern Docker Compose ignores it.

services:
  postgres:
    image: postgres:16-alpine
    container_name: zecathon-postgres
    environment:
      POSTGRES_USER: zecathon
      POSTGRES_PASSWORD: zecathon_secret
      POSTGRES_DB: zecathon
    volumes:
      - zecathon_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zecathon -d zecathon"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: zecathon-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://zecathon:zecathon_secret@postgres:5432/zecathon
      - UPLOAD_DIR=/data/uploads
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - AI_BACKEND_URL=${AI_BACKEND_URL:-}
      - AI_BACKEND_TOKEN=${AI_BACKEND_TOKEN:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    volumes:
      - zecathon_uploads:/data/uploads
      - zecathon_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: zecathon-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  zecathon_pg_data:
  zecathon_uploads:
  zecathon_logs:
