<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Orange gradient circle background -->
  <circle cx="50" cy="50" r="48" fill="url(#circleGrad)" />

  <!-- Dark teal Z arrow with drop shadow -->
  <g fill="#0c4a6e" filter="url(#shadow)">
    <!-- top horizontal bar -->
    <rect x="14" y="22" width="52" height="13" rx="2" />
    <!-- diagonal shaft -->
    <polygon points="66,22 66,35 34,65 34,52" />
    <!-- bottom horizontal bar -->
    <rect x="34" y="65" width="40" height="13" rx="2" />
    <!-- arrow head -->
    <polygon points="74,58 86,72 74,86 74,78 54,78 54,66 74,66" />
  </g>
</svg>
