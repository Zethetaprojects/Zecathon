<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="circleGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Orange gradient circle background -->
  <circle cx="50" cy="50" r="48" fill="url(#circleGrad)" />

  <!-- Teal Z-arrow with drop shadow -->
  <g fill="#116184" filter="url(#shadow)">
    <!-- top horizontal bar -->
    <polygon points="12,22 74,22 74,34 12,34" />

    <!-- diagonal arrow shaft (from top-right down to bottom-left) -->
    <polygon points="74,22 86,28 38,70 26,64" />

    <!-- arrow head pointing up-right -->
    <polygon points="70,12 92,22 86,34 64,24" />

    <!-- three bottom horizontal bars (right side) -->
    <rect x="34" y="66" width="48" height="8" rx="1" />
    <rect x="34" y="76" width="48" height="8" rx="1" />
    <rect x="34" y="86" width="48" height="8" rx="1" />
  </g>
</svg>
